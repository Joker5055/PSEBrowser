name: Build APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== Files before unzip ==="
          ls -la
          if [ ! -f PSEBrowser.zip ]; then
            echo "ERROR: PSEBrowser.zip not found!"
            exit 1
          fi
          unzip -q PSEBrowser.zip
          echo "=== After unzip ==="
          ls -la
          # Remove conflicting .github from zip so it doesn't overwrite
          rm -rf PSEBrowser/.github
          # Move everything else to root
          cp -r PSEBrowser/* .
          cp -r PSEBrowser/.[!.]* . 2>/dev/null || true
          rm -rf PSEBrowser
          echo "=== Final structure ==="
          ls -la
          ls -la app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
